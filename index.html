<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>잉크젯 정비기록 (시험용 v2)</title>

<!--
  ============================================================================
  무한프린터 수집기 — 1차-B 미니앱 「시험용 폼」 v2
  ----------------------------------------------------------------------------
  v1 → v2 바뀐 점 (2026-11-18 사장님 지시):
    · 보충량을 mL 숫자 입력에서 「보충 후 게이지」 선택으로 바꿨다.
      사장님 원문: "보충량은 보충하고나서의 게이지를 알려주는겁니다,
                    (가득/50%/25%/10%) 이렇게 선택되도록 합시다."
    · 통은 색마다 따로 있으므로 K·Y·M·C 네 줄로 나눠 각각 고르게 했다.
      (팀장 판단 — 사장님 확인 대기)
    · 작업에 따라 필요한 칸만 보이게 했다(잉크보충/롤러교체/기타수리).

  이 파일이 확인하려는 것 (시험용이며 진짜 정비 폼이 아니다):
    1) 텔레그램 미니앱 SDK 가 붙는지
    2) 주소에 실어 보낸 값(?dev=...)을 폼이 읽는지
    3) [저장] 이 sendData() 로 JSON 을 봇에게 보내는지
    4) 한글이 깨지지 않고 왕복하는지 (메모 칸)

  인코딩: UTF-8 (BOM 없음) / 줄바꿈 LF
  ============================================================================
-->

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    --bg:   var(--tg-theme-bg-color, #ffffff);
    --fg:   var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #888888);
    --btn:  var(--tg-theme-button-color, #2481cc);
    --btxt: var(--tg-theme-button-text-color, #ffffff);
    --line: var(--tg-theme-section-separator-color, #d9d9d9);
  }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 16px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 10px 12px; }
  legend { font-size: 13px; color: var(--hint); padding: 0 4px; }
  label.row { display: block; padding: 7px 2px; }
  input[type="radio"] { margin-right: 8px; transform: scale(1.25); }
  input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 10px;
    font-size: 16px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg);
  }

  /* 색별 게이지 한 줄: [색이름] [안함][가득][50%][25%][10%] */
  .ink { display: flex; align-items: center; gap: 6px; padding: 5px 0; }
  .ink b { width: 58px; font-weight: 600; font-size: 14px; }
  .ink .opts { display: flex; gap: 5px; flex: 1; }
  .ink .opts label { flex: 1; }
  .ink .opts input { display: none; }           /* 진짜 라디오는 숨기고 */
  .ink .opts span {                              /* 네모 버튼처럼 보이게 */
    display: block; text-align: center; font-size: 13px;
    padding: 8px 0; border: 1px solid var(--line); border-radius: 7px;
    color: var(--hint);
  }
  /* ★선택 상태는 테두리+배경+글자색 세 가지로 구분한다 (어두운 테마에서도 묻히지 않게) */
  .ink .opts input:checked + span {
    background: var(--btn); color: var(--btxt);
    border-color: var(--btn); font-weight: 700;
  }

  button {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 10px; background: var(--btn); color: var(--btxt);
  }
  pre {
    background: rgba(127,127,127,.12); border-radius: 8px;
    padding: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all;
    color: var(--hint); margin-top: 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>정비 기록 — 시험용 v2</h1>
<div class="sub">통로가 뚫렸는지 보는 시험판입니다.</div>

<!-- ① 기기: 주소로 받은 값을 보여주기만 한다 -->
<fieldset>
  <legend>기기</legend>
  <div id="dev">(주소에 기기가 실려 있지 않습니다)</div>
</fieldset>

<!-- ② 작업 선택 -->
<fieldset>
  <legend>작업</legend>
  <label class="row"><input type="radio" name="job" value="헤드교체">헤드교체</label>
  <label class="row"><input type="radio" name="job" value="잉크보충" checked>잉크보충</label>
  <label class="row"><input type="radio" name="job" value="롤러교체">롤러교체</label>
  <label class="row"><input type="radio" name="job" value="호스교체">호스교체</label>
  <label class="row"><input type="radio" name="job" value="기타수리">기타수리</label>
</fieldset>

<!-- ③ 잉크보충일 때만 — 색마다 「보충 후 게이지」 -->
<fieldset id="box-ink">
  <legend>보충 후 게이지 — 색마다 고르십시오</legend>
  <div id="inks"></div>
</fieldset>

<!-- ④ 롤러교체일 때만 -->
<fieldset id="box-roller" class="hidden">
  <legend>롤러 위치</legend>
  <label class="row"><input type="radio" name="roller" value="1단" checked>1단</label>
  <label class="row"><input type="radio" name="roller" value="2단">2단</label>
  <label class="row"><input type="radio" name="roller" value="양면">양면</label>
</fieldset>

<!-- ⑤ 메모 — 한글 왕복 시험 칸 -->
<fieldset>
  <legend>메모 — 한글이 깨지지 않는지 보는 칸</legend>
  <input type="text" id="memo" placeholder="한글 아무거나 적어 보십시오">
</fieldset>

<button id="save">저장</button>

<!-- ⑥ 진단 표시 -->
<pre id="diag">진단 준비 중…</pre>

<script>
(function () {
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  // ---- 색별 게이지 줄 만들기 -------------------------------------------
  // 통은 색마다 따로이므로 네 줄을 만든다. 기본은 "안함"(그 색은 손대지 않음).
  var COLORS = [["K","검정"], ["Y","노랑"], ["M","빨강"], ["C","파랑"]];
  var LEVELS = ["안함", "가득", "50%", "25%", "10%"];
  var html = "";
  COLORS.forEach(function (c) {
    html += '<div class="ink"><b>' + c[0] + ' ' + c[1] + '</b><div class="opts">';
    LEVELS.forEach(function (lv, i) {
      html += '<label><input type="radio" name="ink_' + c[0] + '" value="' + lv + '"'
            + (i === 0 ? " checked" : "") + '><span>' + lv + '</span></label>';
    });
    html += '</div></div>';
  });
  document.getElementById("inks").innerHTML = html;

  // ---- 작업에 따라 필요한 칸만 보이기 ----------------------------------
  function sync() {
    var job = document.querySelector('input[name="job"]:checked');
    job = job ? job.value : "";
    document.getElementById("box-ink").classList.toggle("hidden", job !== "잉크보충");
    document.getElementById("box-roller").classList.toggle("hidden", job !== "롤러교체");
  }
  Array.prototype.forEach.call(
    document.querySelectorAll('input[name="job"]'),
    function (el) { el.addEventListener("change", sync); }
  );
  sync();

  // ---- 주소에 실려 온 기기 값 ------------------------------------------
  var params = new URLSearchParams(window.location.search);
  var dev = params.get("dev");
  if (dev) { document.getElementById("dev").textContent = dev; }

  // ---- 진단 줄 ----------------------------------------------------------
  document.getElementById("diag").textContent =
    "Telegram 객체: " + (tg ? "있음" : "없음(텔레그램 밖에서 열림)") + "\n" +
    "SDK 버전: " + (tg ? tg.version : "-") + "\n" +
    "플랫폼: " + (tg ? tg.platform : "-") + "\n" +
    "initData 길이: " + (tg && tg.initData ? tg.initData.length : 0) + "\n" +
    "주소 질의문자열: " + (window.location.search || "(없음)");

  // ---- 저장: 폼 전체를 JSON 한 덩어리로 봇에게 ------------------------
  document.getElementById("save").addEventListener("click", function () {
    var job = document.querySelector('input[name="job"]:checked');
    job = job ? job.value : "";

    // 색별 게이지 — "안함"이 아닌 색만 담는다
    var ink = {};
    COLORS.forEach(function (c) {
      var sel = document.querySelector('input[name="ink_' + c[0] + '"]:checked');
      if (sel && sel.value !== "안함") { ink[c[0]] = sel.value; }
    });

    var roller = document.querySelector('input[name="roller"]:checked');

    var payload = {
      v: 2,
      test: true,
      dev: dev || "",
      job: job,
      ink: (job === "잉크보충") ? ink : {},                    // 보충 후 게이지
      roller: (job === "롤러교체" && roller) ? roller.value : "",
      memo: document.getElementById("memo").value || "",
      at: new Date().toISOString()
    };

    if (!tg) {
      alert("텔레그램 밖에서 열려 있어 전송할 수 없습니다.\n\n" + JSON.stringify(payload));
      return;
    }
    tg.sendData(JSON.stringify(payload));
  });
})();
</script>
</body>
</html>
